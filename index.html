<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>结构化面试小红书笔记图生成器</title>
<style>
  :root { --accent:#79B86B; --ink:#7f1d2d; --paper:#fffdfb; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f4f4;
    color: #2b2b2b;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 18px 22px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #e5e5e5;
  }
  button {
    appearance: none; border: 0; border-radius: 999px;
    padding: 12px 22px;
    background: var(--accent); color: white;
    font-weight: 700; font-size: 16px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
  }
  button:active { transform: translateY(1px); }
  .meta { font-size: 15px; color: #555; }
  .meta b { color: var(--ink); }
  .hint { margin-left: auto; font-size: 13px; color: #888; }
  .stage {
    display: flex;
    gap: 14px;
    padding: 28px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  .poster-wrap {
    flex: 0 0 200px;
    width: 200px;
    height: 267px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(0,0,0,.14);
  }
  .page-shot {
    display: block;
    width: 200px;
    height: 267px;
    object-fit: cover;
    background: white;
  }
  .copy-panel {
    max-width: 1320px;
    margin: 0 auto 34px;
    padding: 0 28px 28px;
  }
  .copy-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1.4fr;
    gap: 18px;
  }
  .copy-card {
    background: #fff;
    border: 1px solid #e9e9e9;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 26px rgba(0,0,0,.08);
  }
  .copy-card h2 {
    margin: 0 0 10px;
    color: var(--ink);
    font-size: 16px;
  }
  .copy-box {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #222;
    background: #fffdfb;
  }
  #bodyText { min-height: 132px; }
  #tagsText { min-height: 132px; }
  .copy-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .copy-actions button {
    padding: 9px 14px;
    font-size: 14px;
    box-shadow: none;
    background: #7f1d2d;
  }
  @media screen and (max-width: 1100px) {
    .copy-grid { grid-template-columns: 1fr; }
  }

  @media screen and (max-width: 700px) {
    .stage { justify-content: flex-start; padding-left: 16px; padding-right: 16px; }
  }
  @media print {
    body { background: white; }
    .toolbar { display:none; }
    .stage { padding:0; gap:0; }
    .poster { box-shadow:none; break-after: page; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="randomBtn">随机生成一道题</button>
    <button id="downloadBtn" type="button">下载当前三张图</button>
    <div class="meta" id="meta">题库已载入，点击按钮生成。</div>
    <div class="hint">保留外层画框，放大页面正文内容</div>
  </div>
  <main class="stage">
    <div class="poster-wrap"><img class="page-shot" id="shot1" alt="第 1 页" /></div>
    <div class="poster-wrap"><img class="page-shot" id="shot2" alt="第 2 页" /></div>
    <div class="poster-wrap"><img class="page-shot" id="shot3" alt="第 3 页" /></div>
  </main>
  <section class="copy-panel" aria-label="小红书发布文案">
    <div class="copy-grid">
      <div class="copy-card">
        <h2>标题</h2>
        <textarea id="titleText" class="copy-box" readonly></textarea>
      </div>
      <div class="copy-card">
        <h2>正文</h2>
        <textarea id="bodyText" class="copy-box" readonly></textarea>
      </div>
      <div class="copy-card">
        <h2>标签（每次随机排序）</h2>
        <textarea id="tagsText" class="copy-box" readonly></textarea>
      </div>
    </div>
    <div class="copy-actions">
      <button id="copyTitleBtn" type="button">复制标题</button>
      <button id="copyBodyBtn" type="button">复制正文</button>
      <button id="copyTagsBtn" type="button">复制标签</button>
      <button id="copyAllBtn" type="button">复制全部文案</button>
    </div>
  </section>

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const chars = Array.from(text);
  let line = '', lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line); line = ch;
      if (lines.length === maxLines - 1) break;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) lines = lines.slice(0, maxLines);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
}

  const oldText = btn.textContent;
  btn.textContent = '正在生成...'; btn.disabled = true;
  const safe = `${current.category}-${current.title}`.replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 48);
  for (let i = 0; i < 3; i++) {
    const url = await makePosterPng(i);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safe}-第${i + 1}页.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  btn.disabled = false; btn.textContent = oldText;
}
document.getElementById('randomBtn').addEventListener('click', pick);
document.getElementById('downloadBtn').addEventListener('click', downloadCurrent);
document.getElementById('copyTitleBtn').addEventListener('click', () => copyTextFrom('titleText'));
document.getElementById('copyBodyBtn').addEventListener('click', () => copyTextFrom('bodyText'));
document.getElementById('copyTagsBtn').addEventListener('click', () => copyTextFrom('tagsText'));
document.getElementById('copyAllBtn').addEventListener('click', copyAllText);
pick();
</script>
</body>
