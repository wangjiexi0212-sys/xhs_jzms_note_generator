<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>结构化面试小红书笔记图生成器</title>
<style>
  :root { --accent:#79B86B; --ink:#7f1d2d; --paper:#fffdfb; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f4f4f4;
    color: #2b2b2b;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 18px 22px;
    background: rgba(255,255,255,.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #e5e5e5;
  }
  button {
    appearance: none; border: 0; border-radius: 999px;
    padding: 12px 22px;
    background: var(--accent); color: white;
    font-weight: 700; font-size: 16px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
  }
  button:active { transform: translateY(1px); }
  .meta { font-size: 15px; color: #555; }
  .meta b { color: var(--ink); }
  .hint { margin-left: auto; font-size: 13px; color: #888; }
  .stage {
    display: flex;
    gap: 14px;
    padding: 28px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: nowrap;
    overflow-x: auto;
  }
  .poster-wrap {
    flex: 0 0 200px;
    width: 200px;
    height: 267px;
    background: #fff;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(0,0,0,.14);
  }
  .page-shot {
    display: block;
    width: 200px;
    height: 267px;
    object-fit: cover;
    background: white;
  }
  .copy-panel {
    max-width: 1320px;
    margin: 0 auto 34px;
    padding: 0 28px 28px;
  }
  .copy-grid {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1.4fr;
    gap: 18px;
  }
  .copy-card {
    background: #fff;
    border: 1px solid #e9e9e9;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 8px 26px rgba(0,0,0,.08);
  }
  .copy-card h2 {
    margin: 0 0 10px;
    color: var(--ink);
    font-size: 16px;
  }
  .copy-box {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 12px;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #222;
    background: #fffdfb;
  }
  #bodyText { min-height: 132px; }
  #tagsText { min-height: 132px; }
  .copy-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .copy-actions button {
    padding: 9px 14px;
    font-size: 14px;
    box-shadow: none;
    background: #7f1d2d;
  }
  @media screen and (max-width: 1100px) {
    .copy-grid { grid-template-columns: 1fr; }
  }

  @media screen and (max-width: 700px) {
    .stage { justify-content: flex-start; padding-left: 16px; padding-right: 16px; }
  }
  @media print {
    body { background: white; }
    .toolbar { display:none; }
    .stage { padding:0; gap:0; }
    .poster { box-shadow:none; break-after: page; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button id="randomBtn">随机生成一道题</button>
    <button id="downloadBtn" type="button">下载当前完整题目</button>
    <div class="meta" id="meta">题库已载入，点击按钮生成。</div>
    <div class="hint">保留外层画框，放大页面正文内容</div>
  </div>
  <main class="stage" id="stage"></main>
  <section class="copy-panel" aria-label="小红书发布文案">
    <div class="copy-grid">
      <div class="copy-card">
        <h2>标题</h2>
        <textarea id="titleText" class="copy-box" readonly></textarea>
      </div>
      <div class="copy-card">
        <h2>正文</h2>
        <textarea id="bodyText" class="copy-box" readonly></textarea>
      </div>
      <div class="copy-card">
        <h2>标签（每次随机排序）</h2>
        <textarea id="tagsText" class="copy-box" readonly></textarea>
      </div>
    </div>
    <div class="copy-actions">
      <button id="copyTitleBtn" type="button">复制标题</button>
      <button id="copyBodyBtn" type="button">复制正文</button>
      <button id="copyTagsBtn" type="button">复制标签</button>
      <button id="copyAllBtn" type="button">复制全部文案</button>
    </div>
  </section>
<script>
const QUESTIONS = [{"category":"应急应变","color":"#82B9DE","title":"开会时设备出问题","start":4,"pages":["assets/pages/应急应变/004-page-004.png","assets/pages/应急应变/004-page-005.png","assets/pages/应急应变/004-page-006.png"],"question":"领导让你负责组织会议，开会的时候设备出现了问题，影响到了会 议的进度。此时，你怎么办？","allPages":["assets/pages/应急应变/004-page-004.png","assets/pages/应急应变/004-page-005.png","assets/pages/应急应变/004-page-006.png","assets/pages/应急应变/004-page-007.png"],"analysis":"这道题考查会务突发故障中的统筹能力。重点是专业排障与议程协 调同时进行，保障核心信息准确传达；不能只埋头修设备，也不能随意 改动必须依赖材料的审议内容。"},{"category":"应急应变","color":"#82B9DE","title":"满天乌云密布","start":8,"pages":["assets/pages/应急应变/008-page-008.png","assets/pages/应急应变/008-page-009.png","assets/pages/应急应变/008-page-010.png"],"question":"即将下课，但是满天乌云密布，作为上课老师，你会怎么办？","allPages":["assets/pages/应急应变/008-page-008.png","assets/pages/应急应变/008-page-009.png","assets/pages/应急应变/008-page-010.png","assets/pages/应急应变/008-page-011.png"],"analysis":"这道题的关键是根据真实天气风险作适度处置。“下课”不必然等 于“放学”，乌云也不等于已经发生灾害；回答应结合是否离校、预警 和学校安排判断，避免机械延迟下课或让学生冒险出行。"},{"category":"应急应变","color":"#82B9DE","title":"校运会学生相撞骨折","start":12,"pages":["assets/pages/应急应变/012-page-012.png","assets/pages/应急应变/012-page-013.png","assets/pages/应急应变/012-page-014.png"],"question":"学校开校运会，班上两名同学相撞骨折，双方家长来学校协商，发 生冲突，作为班主任，你怎么处理？","allPages":["assets/pages/应急应变/012-page-012.png","assets/pages/应急应变/012-page-013.png","assets/pages/应急应变/012-page-014.png","assets/pages/应急应变/012-page-015.png"],"analysis":"这道题同时涉及学生救治和家长冲突，应先稳住现场并确认医疗照 护。责任和费用需依据调查与相应程序处理，不能预先认定为纯属意外、 双方无责，或代替学校承诺赔偿。"},{"category":"应急应变","color":"#82B9DE","title":"教学方法不同","start":16,"pages":["assets/pages/应急应变/016-page-016.png","assets/pages/应急应变/016-page-017.png","assets/pages/应急应变/016-page-018.png"],"question":"在教学工作中，一位经验丰富的老教师经常对你的教学设计、教学 方法等提出不同意见，部分意见与你的教学思路存在差异。这种情况导 致班级学生对课堂内容的理解产生困惑，不清楚该遵循哪种教学指引， 同时也给你带来了一定的工作困扰。此时，你会采取哪些措施解决这一 问题？","allPages":["assets/pages/应急应变/016-page-016.png","assets/pages/应急应变/016-page-017.png","assets/pages/应急应变/016-page-018.png","assets/pages/应急应变/016-page-019.png"],"analysis":"这道题兼具教学协作和学生困惑处理。重点是先澄清学习要求，再 与同事基于课程目标和学情研究差异；不因资历盲从，也不让学生在两 位教师之间选边站。"},{"category":"应急应变","color":"#82B9DE","title":"半夜突发学生生病","start":20,"pages":["assets/pages/应急应变/020-page-020.png","assets/pages/应急应变/020-page-021.png","assets/pages/应急应变/020-page-022.png"],"question":"作为老师，半夜突发学生生病，但此时你的家人恰巧也在生病需要 照顾，你该怎么办？","allPages":["assets/pages/应急应变/020-page-020.png","assets/pages/应急应变/020-page-021.png","assets/pages/应急应变/020-page-022.png","assets/pages/应急应变/020-page-023.png"],"analysis":"这道题考查双重照护需要下的协调能力。应根据双方实际紧急程度 启动就近救助、落实成人接替，不把职责理解为必须亲自包办，也不能 因等待家长意见或安排家人而延误急救。"},{"category":"应急应变","color":"#82B9DE","title":"文化廊很多是学生照片","start":24,"pages":["assets/pages/应急应变/024-page-024.png","assets/pages/应急应变/024-page-025.png","assets/pages/应急应变/024-page-026.png"],"question":"周边学校来你校参观学校的文化长廊，但是发现展示的很多是学生 照片，作为负责人，你怎么处理？","allPages":["assets/pages/应急应变/024-page-024.png","assets/pages/应急应变/024-page-025.png","assets/pages/应急应变/024-page-026.png","assets/pages/应急应变/024-page-027.png"],"analysis":"这道题信息较少，照片多不必然意味着文化建设有问题。应先了解 参观者关注点，围绕真实展陈解释育人内涵；确有不足再承认和改进， 不能编造现场不存在的板块，也不必未经判断就全面致歉。"},{"category":"应急应变","color":"#82B9DE","title":"学生投诉科任老师不公","start":28,"pages":["assets/pages/应急应变/028-page-028.png","assets/pages/应急应变/028-page-029.png","assets/pages/应急应变/028-page-030.png"],"question":"科任老师反映某学生上课纪律不好，希望班主任对其处罚，该学生 投诉科任老师不公平，对此，作为班主任，你怎么处理？","allPages":["assets/pages/应急应变/028-page-028.png","assets/pages/应急应变/028-page-029.png","assets/pages/应急应变/028-page-030.png","assets/pages/应急应变/028-page-031.png"],"analysis":"这道题包含违纪反映和不公平投诉两条线索，应分别核实、分别回 应。班主任既不先替同事处罚，也不先认定学生受委屈；纪律要求与教 师管理方式都应经得起事实检验。"},{"category":"应急应变","color":"#82B9DE","title":"外出游玩一名学生走丢","start":32,"pages":["assets/pages/应急应变/032-page-032.png","assets/pages/应急应变/032-page-033.png","assets/pages/应急应变/032-page-034.png"],"question":"组织学生外出游玩时一名学生走丢，这位学生平时独来独往，全体 老师、队员找遍了也没找到，你怎么办？","allPages":["assets/pages/应急应变/032-page-032.png","assets/pages/应急应变/032-page-033.png","assets/pages/应急应变/032-page-034.png","assets/pages/应急应变/032-page-035.png"],"analysis":"这道题已说明多方寻找未果，应立即升级为有组织的应急搜寻。要 同步看护其余学生、报警和汇总线索，不能继续让全体师生分散寻找， 也不能仅凭独来独往的习惯推测去向。"},{"category":"应急应变","color":"#82B9DE","title":"教育某生语言犀利","start":36,"pages":["assets/pages/应急应变/036-page-036.png","assets/pages/应急应变/036-page-037.png","assets/pages/应急应变/036-page-038.png"],"question":"你在教育某生中语言犀利，学生回家告诉家长，家长来找你，你怎 么办？","allPages":["assets/pages/应急应变/036-page-036.png","assets/pages/应急应变/036-page-037.png","assets/pages/应急应变/036-page-038.png","assets/pages/应急应变/036-page-039.png"],"analysis":"这道题已明确教师教育语言过于犀利，应正视自身表达责任。回答 要区分对不当语言的道歉与对原有教育问题的处理，突出修复和具体改 进，不能用“为了孩子好”淡化伤害或要求立即原谅。"},{"category":"应急应变","color":"#82B9DE","title":"小鸟飞进教室","start":40,"pages":["assets/pages/应急应变/040-page-040.png","assets/pages/应急应变/040-page-041.png","assets/pages/应急应变/040-page-042.png"],"question":"你在上课时，有一只小鸟突然飞进了教室，同学们都在抓小鸟，场 面极其混乱，你会怎么办？","allPages":["assets/pages/应急应变/040-page-040.png","assets/pages/应急应变/040-page-041.png","assets/pages/应急应变/040-page-042.png","assets/pages/应急应变/040-page-043.png"],"analysis":"这道题的紧急点是学生追逐造成的混乱。应先防止碰撞和攀爬，再 由成人妥善处理小鸟、恢复教学；不能为了尽快赶走小鸟，让学生参与 追赶或冒险开窗。"},{"category":"应急应变","color":"#82B9DE","title":"回答问题被嘲笑","start":44,"pages":["assets/pages/应急应变/044-page-044.png","assets/pages/应急应变/044-page-045.png","assets/pages/应急应变/044-page-046.png"],"question":"一个学生上课回答问题不当，引发全班嘲笑，然后和别人打起来了 ，你会怎么处理？","allPages":["assets/pages/应急应变/044-page-044.png","assets/pages/应急应变/044-page-045.png","assets/pages/应急应变/044-page-046.png","assets/pages/应急应变/044-page-047.png"],"analysis":"这道题同时包含课堂嘲笑和肢体冲突，应先制止伤害，再核实各方 行为。教育处理需区分嘲笑、还击等责任，既维护回答问题者的尊严， 也不能用受委屈替代对打架行为的纠正。"},{"category":"应急应变","color":"#82B9DE","title":"因经费预算和同事争执","start":48,"pages":["assets/pages/应急应变/048-page-048.png","assets/pages/应急应变/048-page-049.png","assets/pages/应急应变/048-page-050.png"],"question":"学校要举办一次开放活动，领导让你和同事负责，但你因为经费问 题预算和同事发生争执，你会怎么办？","allPages":["assets/pages/应急应变/048-page-048.png","assets/pages/应急应变/048-page-049.png","assets/pages/应急应变/048-page-050.png","assets/pages/应急应变/048-page-051.png"],"analysis":"这道题侧重工作分歧中的自我调节和协作。应先停止情绪化争执， 再用活动需求、预算限制和可比较方案讨论；不能把节约等同于一味削 减，也不能为保持关系私自垫付或绕开审批。"},{"category":"应急应变","color":"#82B9DE","title":"活动突然断电","start":52,"pages":["assets/pages/应急应变/052-page-052.png","assets/pages/应急应变/052-page-053.png","assets/pages/应急应变/052-page-054.png"],"question":"领导让你组织一场社区活动，活动进行中突然停电，现场混乱，你 是活动的组织者，你如何处理？","allPages":["assets/pages/应急应变/052-page-052.png","assets/pages/应急应变/052-page-053.png","assets/pages/应急应变/052-page-054.png","assets/pages/应急应变/052-page-055.png"],"analysis":"这道题的核心是停电后的现场安全和活动调整。应先控制混乱、核 实危险，再判断继续、转场或延期的条件；不能默认停电只是设备问题 ，也不能为维持活动而仓促把人群带到陌生场地。"},{"category":"应急应变","color":"#82B9DE","title":"学生家长拿刀强闯进校","start":56,"pages":["assets/pages/应急应变/056-page-056.png","assets/pages/应急应变/056-page-057.png","assets/pages/应急应变/056-page-058.png"],"question":"有个学生家长拿刀强闯进校，现场挥着小刀，学生和老师吓到躲避 ，你在现场会怎么办？","allPages":["assets/pages/应急应变/056-page-056.png","assets/pages/应急应变/056-page-057.png","assets/pages/应急应变/056-page-058.png","assets/pages/应急应变/056-page-059.png"],"analysis":"这道题是持械侵入校园的现实危险，首要任务是避险、报警和专业 处置。教师应根据安全路线撤离或就近避护，不能主动靠近谈判、抢刀 或参与围堵，将自己和学生置于更大风险中。"},{"category":"应急应变","color":"#82B9DE","title":"学生相处很拘谨","start":60,"pages":["assets/pages/应急应变/060-page-060.png","assets/pages/应急应变/060-page-061.png","assets/pages/应急应变/060-page-062.png"],"question":"你接手了一个新的班级，但是班上的学生跟你相处很拘谨，甚至故 意躲避你，你会怎么办？","allPages":["assets/pages/应急应变/060-page-060.png","assets/pages/应急应变/060-page-061.png","assets/pages/应急应变/060-page-062.png","assets/pages/应急应变/060-page-063.png"],"analysis":"这道题虽归入应急应变类，实质更侧重师生关系的持续改善。应了 解新班级的适应情况、反思沟通方式，通过稳定且尊重的日常互动建立 信任，不能把拘谨直接归为学生的问题。"},{"category":"应急应变","color":"#82B9DE","title":"学生打球突然晕倒","start":64,"pages":["assets/pages/应急应变/064-page-064.png","assets/pages/应急应变/064-page-065.png","assets/pages/应急应变/064-page-066.png"],"question":"有个学生打篮球时突然晕倒在地，引起周围同学围观，有学生向正 好经过篮球场的你反馈此事，但是领导现在有急事，需要你去处理，你 会怎么办？","allPages":["assets/pages/应急应变/064-page-064.png","assets/pages/应急应变/064-page-065.png","assets/pages/应急应变/064-page-066.png","assets/pages/应急应变/064-page-067.png"],"analysis":"这道题考查生命安全与工作任务冲突时的排序。应立即启动救助并 协调领导事务，明确成人陪护与交接；不能等待请示后才急救，也不能 把医疗陪同和照护责任交给学生。"},{"category":"应急应变","color":"#82B9DE","title":"学生发高烧","start":68,"pages":["assets/pages/应急应变/068-page-068.png","assets/pages/应急应变/068-page-069.png","assets/pages/应急应变/068-page-070.png"],"question":"你正在上课，有一位学生不舒服，并且有发高烧的迹象，你会怎么 办？","allPages":["assets/pages/应急应变/068-page-068.png","assets/pages/应急应变/068-page-069.png","assets/pages/应急应变/068-page-070.png","assets/pages/应急应变/068-page-071.png"],"analysis":"这道题应把学生健康放在首位，同时安排好课堂。发热须通过规范 测温和专业评估了解，处置轻重取决于整体状态，不仅看温度；不能依 靠学生照护或由教师自行储药、随意给药。"},{"category":"应急应变","color":"#82B9DE","title":"学生打架","start":72,"pages":["assets/pages/应急应变/072-page-072.png","assets/pages/应急应变/072-page-073.png","assets/pages/应急应变/072-page-074.png"],"question":"你在办公室，有学生跑过来告诉你说班上有学生在打架，而且其中 一个同学鼻子流血了，你会怎么办？","allPages":["assets/pages/应急应变/072-page-072.png","assets/pages/应急应变/072-page-073.png","assets/pages/应急应变/072-page-074.png","assets/pages/应急应变/072-page-075.png"],"analysis":"这道题已有打架和流血的明确事实，应同步制止冲突、处理伤情并 呼叫成人协助。事后再核实原因、区分责任，不能用统一道歉代替处理 ，也不能因是鼻出血就忽视受伤可能。"},{"category":"应急应变","color":"#82B9DE","title":"关心学生后被投诉","start":76,"pages":["assets/pages/应急应变/076-page-076.png","assets/pages/应急应变/076-page-077.png","assets/pages/应急应变/076-page-078.png"],"question":"你所带班级中有一名学生，因家庭突发变故出现情绪持续低落、学 习积极性下降、成绩明显下滑的情况。你多次尝试与该生家长沟通，希 望共同帮助学生调整状态，但沟通效果不佳。随后，家长反而向学校领 导投诉，认为你过度关注学生个人情况属于“多管闲事”，未将精力放 在正常教学工作上。面对这一情况，你会如何处理？","allPages":["assets/pages/应急应变/076-page-076.png","assets/pages/应急应变/076-page-077.png","assets/pages/应急应变/076-page-078.png","assets/pages/应急应变/076-page-079.png"],"analysis":"这道题需同时回应投诉与学生支持需求。应核实此前沟通是否越界 ，调整频率和信息范围，但不因家长不满放弃教育关怀；涉及明显安全 风险时，仍应按学校机制及时处理。"},{"category":"应急应变","color":"#82B9DE","title":"上课时学生搜题","start":80,"pages":["assets/pages/应急应变/080-page-080.png","assets/pages/应急应变/080-page-081.png","assets/pages/应急应变/080-page-082.png"],"question":"在你讲解题目时，有学生拿出手机小猿搜题，并与同学讨论说，你 讲的没有小猿搜题的好，你会怎么办？","allPages":["assets/pages/应急应变/08 模拟/028-page-030.png"],"question":"“小升初”即将来临，你班上不少学生的心理压力很大，需要开一 次舒缓压力的班会，作为班主任，你会在班会中说什么？请现场模拟","allPages":["assets/pages/情景模拟/028-page-028.png","assets/pages/情景模拟/028-page-029.png","assets/pages/情景模拟/028-page-030.png","assets/pages/情景模拟/028-page-031.png"],"analysis":"本题模拟班会发言，面对的是全班学生。应以温和、可参与的方式 帮助学生表达升学担忧，形成具体支持感；不宜写成教师向考官汇报班 会流程，也不能承诺所有学生都不再焦虑。"},{"category":"情景模拟","color":"#B69AD6","title":"学生开学收心困难","start":32,"pages":["assets/pages/情景模拟/032-page-032.png","assets/pages/情景模拟/032-page-033.png","assets/pages/情景模拟/032-page-034.png"],"question":"在开学家长会上，有家长反映假期之后孩子收心困难，对此很焦虑 ，作为班主任你如何沟通？ 请现场模拟","allPages":["assets/pages/情景模拟/032-page-032.png","assets/pages/情景模拟/032-page-033.png","assets/pages/情景模拟/032-page-034.png","assets/pages/情景模拟/032-page-035.png"],"analysis":"本题面向开学家长会，需要把家长的焦虑转化为合理预期和可执行 的支持。注意区分短期适应与持续困难，避免把孩子一概说成懒散，也 不宜用成绩下滑的后果加重焦虑。"},{"category":"情景模拟","color":"#B69AD6","title":"父母给学生报兴趣班","start":36,"pages":["assets/pages/情景模拟/036-page-036.png","assets/pages/情景模拟/036-page-037.png","assets/pages/情景模拟/036-page-038.png"],"question":"小红的父母给小红报了很多课外兴趣班，可是小红很多都不喜欢， 她找到你，作为她的班主任老师，你会怎么电话和她家长沟通？ 请现场 模拟","allPages":["assets/pages/情景模拟/036-page-036.png","assets/pages/情景模拟/036-page-037.png","assets/pages/情景模拟/036-page-038.png","assets/pages/情景模拟/036-page-039.png"],"analysis":"本题要求电话与家长沟通，重点是把孩子不喜欢多项兴趣班的反馈 转化为共同评估课程安排的契机。既理解家长投入，也尊重孩子的感受 ，避免替家长直接决定退课或把所有不喜欢都归因于负担过重。"},{"category":"情景模拟","color":"#B69AD6","title":"家长说自己没有文化","start":40,"pages":["assets/pages/情景模拟/040-page-040.png","assets/pages/情景模拟/040-page-041.png","assets/pages/情景模拟/040-page-042.png"],"question":"一位家长在家长会后找到你，说“我没有文化，孩子的教育教学就 交给老师你了”作为班主任，你如何回应？请现场模拟","allPages":["assets/pages/情景模拟/040-page-040.png","assets/pages/情景模拟/040-page-041.png","assets/pages/情景模拟/040-page-042.png","assets/pages/情景模拟/040-page-043.png"],"analysis":"本题是回应家长因文化程度而产生的教育无力感。应尊重其信任， 澄清家校各自能做的支持，提供不依赖讲题能力的参与方法；不能贬低 家长，也不能把教师教学责任转给家庭。"},{"category":"情景模拟","color":"#B69AD6","title":"学生考试压力大","start":44,"pages":["assets/pages/情景模拟/044-page-044.png","assets/pages/情景模拟/044-page-045.png","assets/pages/情景模拟/044-page-046.png"],"question":"由于临近期末考试，小明同学压力大，焦虑，甚至晚上总是睡不着 ，他找到你倾诉，你会怎么安慰他？ 请现场模拟","allPages":["assets/pages/情景模拟/044-page-044.png","assets/pages/情景模拟/044-page-045.png","assets/pages/情景模拟/044-page-046.png","assets/pages/情景模拟/044-page-047.png"],"analysis":"本题是对已有睡眠困扰的学生进行支持性沟通。要认真倾听压力来 源，帮助学生降低过高要求并获得成人支持，不轻描淡写地说“大家都 这样”，也不承诺简单方法一定能解决失眠。"},{"category":"情景模拟","color":"#B69AD6","title":"慰问敬老院","start":48,"pages":["assets/pages/情景模拟/048-page-048.png","assets/pages/情景模拟/048-page-049.png","assets/pages/情景模拟/048-page-050.png"],"question":"你单位组织人员到当地敬老院进行慰问，由于所带的慰问品数量不 够，有一些老人没有领到，老人质疑不公平，情绪很激动，并吵闹起来 ，你怎么劝说？请现场模拟","allPages":["assets/pages/情景模拟/048-page-048.png","assets/pages/情景模拟/048-page-049.png","assets/pages/情景模拟/048-page-050.png","assets/pages/情景模拟/048-page-051.png"],"analysis":"本题是公共活动中面对不公平质疑的现场沟通。应承认数量不足造 成的实际遗漏，解释核实与补发安排，用可兑现的信息建立信任，不推 责给敬老院，不用劝老人别生气代替解决问题。"},{"category":"情景模拟","color":"#B69AD6","title":"家长给你充话费","start":52,"pages":["assets/pages/情景模拟/052-page-052.png","assets/pages/情景模拟/052-page-053.png","assets/pages/情景模拟/052-page-054.png"],"question":"你是班主任，在家长会上，班上一名学生家长为了提高孩子的学习 成绩，想让你多关注他的孩子，给你发红包被拒后直接给你的手机进行 话费充值。请问此时你该怎么办？ 请现场模拟","allPages":["assets/pages/情景模拟/052-page-052.png","assets/pages/情景模拟/052-page-053.png","assets/pages/情景模拟/052-page-054.png","assets/pages/情景模拟/052-page-055.png"],"analysis":"本题考查在家长表达关切时守住廉洁、公平的边界。沟通中既要明 确退还话费充值，也要回应孩子学习上的真实需求，避免公开让家长难 堪，更不能用额外照顾交换家长的配合。"},{"category":"情景模拟","color":"#B69AD6","title":"网瘾少年","start":56,"pages":["assets/pages/情景模拟/056-page-056.png","assets/pages/情景模拟/056-page-057.png","assets/pages/情景模拟/056-page-058.png"],"question":"你是一名班主任，你班里有一个网瘾少年彻夜未归上通宵网，第二 天你看到了他，你会怎么跟他说？ 请现场模拟","allPages":["assets/pages/情景模拟/056-page-056.png","assets/pages/情景模拟/056-page-057.png","assets/pages/情景模拟/056-page-058.png","assets/pages/情景模拟/056-page-059.png"],"analysis":"本题的首要关切是学生彻夜未归后的安全与状态，其次才是上网行 为。模拟中应私下倾听、清楚表达边界，帮助学生与监护人建立支持方 案，不以“网瘾”标签代替了解，更不夸大未来后果。"},{"category":"人际关系","color":"#E7B184","title":"家长要求转走特殊儿童","start":4,"pages":["assets/pages/人际关系/004-page-004.png","assets/pages/人际关系/004-page-005.png","assets/pages/人际关系/004-page-006.png"],"question":"家长向你投诉，说班级的特殊儿童影响了他的孩子学习，要求你把 那位特殊儿童转走，你会怎么办？","allPages":["assets/pages/人际关系/004-page-004.png","assets/pages/人际关系/004-page-005.png","assets/pages/人际关系/004-page-006.png","assets/pages/人际关系/004-page-007.png"],"analysis":"题干的实质是家长要求将有特殊教育需要的儿童转走，不能只当作 座位调整。应同时回应学习受影响的具体问题、保障平等参与，涉及安 置的决定不能由教师凭单方诉求作出。"},{"category":"人际关系","color":"#E7B184","title":"家长质疑你的能力","start":8,"pages":["assets/pages/人际关系/008-page-008.png","assets/pages/人际关系/008-page-009.png","assets/pages/人际关系/008-page-010.png"],"question":"你入职后，有家长认为你太年轻了，质疑你的教学能力，你会如何 回应？后续会采取哪些措施？","allPages":["assets/pages/人际关系/008-page-008.png","assets/pages/人际关系/008-page-009.png","assets/pages/人际关系/008-page-010.png","assets/pages/人际关系/008-page-011.png"],"analysis":"本题的质疑依据是教师年轻，且明确要求回答后续措施。应承认经 验仍需积累，用可验证的教学准备和反馈回应，不能自夸年轻就更有优 势，也不必为年龄本身道歉。"},{"category":"人际关系","color":"#E7B184","title":"学生要去打工","start":12,"pages":["assets/pages/人际关系/012-page-012.png","assets/pages/人际关系/012-page-013.png","assets/pages/人际关系/012-page-014.png"],"question":"学生跟家长发生矛盾，要去打工，作为班主任你应该怎么处理？","allPages":["assets/pages/人际关系/012-page-012.png","assets/pages/人际关系/012-page-013.png","assets/pages/人际关系/012-page-014.png","assets/pages/人际关系/012-page-015.png"],"analysis":"本题既有亲子冲突，也可能涉及离校、离家和受教育支持。要先确 认安全，再了解打工念头背后的原因；不能仅用劝孩子体谅父母处理所 有情况，更不能忽略家庭伤害或经济困难。"},{"category":"人际关系","color":"#E7B184","title":"家庭原因影响成绩","start":16,"pages":["assets/pages/人际关系/016-page-016.png","assets/pages/人际关系/016-page-017.png","assets/pages/人际关系/016-page-018.png"],"question":"小明的父母离婚了，他的成绩一度下滑，变得内向，你作为班主任 怎么办？","allPages":["assets/pages/人际关系/016-page-016.png","assets/pages/人际关系/016-page-017.png","assets/pages/人际关系/016-page-018.png","assets/pages/人际关系/016-page-019.png"],"analysis":"本题关注家庭变化后学生的学习和情绪支持。不能把内向本身视为 缺陷，也不能假定离婚必然造成伤害；应了解小明眼前的困难，稳定照 护与学校支持，避免把恢复成绩作为唯一目标。"},{"category":"人际关系","color":"#E7B184","title":"募集家长志愿者","start":20,"pages":["assets/pages/人际关系/020-page-020.png","assets/pages/人际关系/020-page-021.png","assets/pages/人际关系/020-page-022.png"],"question":"学校准备和家长社会一起开设护学岗，需要募集家长志愿者，一些 家长以工作忙，没时间等理由回绝了。作为老师，你会怎么办？","allPages":["assets/pages/人际关系/020-page-020.png","assets/pages/人际关系/020-page-021.png","assets/pages/人际关系/020-page-022.png","assets/pages/人际关系/020-page-023.png"],"analysis":"本题是志愿岗位招募，家长拒绝可能有真实时间困难。应坚持自愿 ，明确岗位与保障，通过合理安排争取参与；不能让孩子待遇与家长值 岗挂钩，也不能将校园安全责任转给家长。"},{"category":"人际关系","color":"#E7B184","title":"同学被孤立","start":24,"pages":["assets/pages/人际关系/024-page-024.png","assets/pages/人际关系/024-page-025.png","assets/pages/人际关系/024-page-026.png"],"question":"你们班上有一个同学被其他同学孤立，你会怎么做？","allPages":["assets/pages/人际关系/024-page-024.png","assets/pages/人际关系/024-page-025.png","assets/pages/人际关系/024-page-026.png","assets/pages/人际关系/024-page-027.png"],"analysis":"本题关注学生被孤立的实际处境。应及时干预，区分一般交往困难 与恶意排斥、欺凌；保护不能以要求受排斥学生变得讨人喜欢为前提， 也不能强迫所有人建立私人友谊。"},{"category":"人际关系","color":"#E7B184","title":"学生抱怨老师迟到","start":28,"pages":["assets/pages/人际关系/028-page-028.png","assets/pages/人际关系/028-page-029.png","assets/pages/人际关系/028-page-030.png"],"question":"你上课迟到了，同学们开玩笑，说老师怎么也会迟到，你该怎么办 ？","allPages":["assets/pages/人际关系/028-page-028.png","assets/pages/人际关系/028-page-029.png","assets/pages/人际关系/028-page-030.png","assets/pages/人际关系/028-page-031.png"],"analysis":"本题是教师迟到后面对学生提醒。应承认事实、尊重同一规则并尽 快恢复教学，幽默可有可无；不能编造理由，也不应通过拖堂或追加作 业让学生承担迟到的代价。"},{"category":"人际关系","color":"#E7B184","title":"家长不愿 AI 完成作业","start":32,"pages":["assets/pages/人际关系/032-page-032.png","assets/pages/人际关系/032-page-033.png","assets/pages/人际关系/032-page-034.png"],"question":"AI 能为孩子学习带来便利，但家长不愿意孩子通过 AI 完成作业，希 望让校方进行停止这类似的课程，你怎么沟通？","allPages":["assets/pages/人际关系/032-page-032.png","assets/pages/人际关系/032-page-033.png","assets/pages/人际关系/032-page-034.png","assets/pages/人际关系/032-page-035.png"],"analysis":"本题应先区分家长反对的是 AI 代做作业还是课程本身，再核实学校 真实安排。沟通既要说明合理学习价值，也要回应独立思考、隐私和适 龄使用的顾虑，不能先认定所有 AI 课程都有必要保留。"},{"category":"人际关系","color":"#E7B184","title":"家长对同事有意见","start":36,"pages":["assets/pages/人际关系/036-page-036.png","assets/pages/人际关系/036-page-037.png","assets/pages/人际关系/036-page-038.png"],"question":"有家长投诉你的搭班同事在教学上过于躺平，对待教学比较随意， 你会如何做？","allPages":["assets/pages/人际关系/036-page-036.png","assets/pages/人际关系/036-page-037.png","assets/pages/人际关系/036-page-038.png","assets/pages/人际关系/036-page-039.png"],"analysis":"本题涉及家长反馈与同事合作。重点是把“躺平”的评价转化为可 核实的教学问题，在维护学生利益的基础上沟通改进，既不附和指责， 也不为同事隐瞒问题。"},{"category":"人际关系","color":"#E7B184","title":"家长要求换老师","start":40,"pages":["assets/pages/人际关系/040-page-040.png","assets/pages/人际关系/040-page-041.png","assets/pages/人际关系/040-page-042.png"],"question":"家长认为你教学方法不对，要求换老师，你怎么办？","allPages":["assets/pages/人际关系/040-page-040.png","assets/pages/人际关系/040-page-041.png","assets/pages/人际关系/040-page-042.png","assets/pages/人际关系/040-page-043.png"],"analysis":"本题既有教学方法争议，也有换教师的诉求。要核实方法与学生需 求是否匹配，主动改进并配合学校处理人员安排；不能要求家长撤回诉 求才能沟通，也不能自行承诺换或不换。"},{"category":"人际关系","color":"#E7B184","title":"勾心斗角","start":44,"pages":["assets/pages/人际关系/044-page-044.png","assets/pages/人际关系/044-page-045.png","assets/pages/人际关系/044-page-046.png"],"question":"你是一个新入职的老师，发现同事们勾心斗角，你应该怎么处理？","allPages":["assets/pages/人际关系/044-page-044.png","assets/pages/人际关系/044-page-045.png","assets/pages/人际关系/044-page-046.png","assets/pages/人际关系/044-page-047.png"],"analysis":"本题考查新教师面对复杂同事关系时的职业判断。要区分传言、一 般分歧与影响工作的具体行为，保持公平合作和必要边界，不参与站队 ，也不把自己放在调解所有矛盾的位置。"},{"category":"人际关系","color":"#E7B184","title":"老教师请你帮忙","start":48,"pages":["assets/pages/人际关系/048-page-048.png","assets/pages/人际关系/048-page-049.png","assets/pages/人际关系/048-page-050.png"],"question":"你是新老师，有老教师一直请你帮忙看自习、改作业，你会怎么办 ？","allPages":["assets/pages/人际关系/048-page-048.png","assets/pages/人际关系/048-page-049.png","assets/pages/人际关系/048-page-050.png","assets/pages/人际关系/048-page-051.png"],"analysis":"本题的求助内容涉及看自习和批改作业，必须兼顾学生照护和教学 责任。应先评估再承诺，对长期、反复的代办明确安排，不能为了人情 同时承担无法兼顾的班级管理任务。"},{"category":"人际关系","color":"#E7B184","title":"家长见教师抽烟","start":52,"pages":["assets/pages/人际关系/052-page-052.png","assets/pages/人际关系/052-page-053.png","assets/pages/人际关系/052-page-054.png"],"question":"有老师在学校走廊抽烟，被家长看到了，你作为当事老师，面对这 样的情况，你会怎么办？","allPages":["assets/pages/人际关系/052-page-052.png","assets/pages/人际关系/052-page-053.png","assets/pages/人际关系/052-page-054.png","assets/pages/人际关系/052-page-055.png"],"analysis":"本题已明确教师在学校走廊吸烟，首先应纠正行为并承担责任。沟 通不应停留在维护形象或请求家长保密，改进要落到遵守校园要求和防 止再次发生。"},{"category":"人际关系","color":"#E7B184","title":"地震后学生情绪不稳定","start":56,"pages":["assets/pages/人际关系/056-page-056.png","assets/pages/人际关系/056-page-057.png","assets/pages/人际关系/056-page-058.png"],"question":"因前期学生经历一次地震，很多学生受到惊吓，导致现在还有学生 上课情绪不稳定，作为班主任老师，你会采取什么措施？","allPages":["assets/pages/人际关系/056-page-056.png","assets/pages/人际关系/056-page-057.png","assets/pages/人际关系/056-page-058.png","assets/pages/人际关系/056-page-059.png"],"analysis":"本题虽放在人际关系资料中，核心是灾后学生支持。应重建安全感 和日常稳定，尊重表达意愿并分层求助；不能强迫回忆灾难、给所有学 生贴心理疾病标签，或要求短期内恢复如常。"},{"category":"人际关系","color":"#E7B184","title":"同事贬低你的教学方法","start":60,"pages":["assets/pages/人际关系/060-page-060.png","assets/pages/人际关系/060-page-061.png","assets/pages/人际关系/060-page-062.png"],"question":"你和同年级的另一位教师负责同一个学科的教学，对方经常私下向 学生和家长贬低你的教学方法，影响你的口碑。面对这种情况，你会怎 么应对？","allPages":["assets/pages/人际关系/060-page-060.png","assets/pages/人际关系/060-page-061.png","assets/pages/人际关系/060-page-062.png","assets/pages/人际关系/060-page-063.png"],"analysis":"本题已涉及反复贬低带来的口碑影响，应区分专业分歧与不实言论。 既改进教学，也明确不当沟通的边界；不能只要求自己更优秀来承担他 人行为后果，更不能在家长群公开反击。"},{"category":"人际关系","color":"#E7B184","title":"学生上课时趴桌睡觉","start":64,"pages":["assets/pages/人际关系/064-page-064.png","assets/pages/人际关系/064-page-065.png","assets/pages/人际关系/064-page-066.png"],"question":"某学生上课交头接耳，你提醒他后他就趴下睡觉，还认为睡觉不影 响别人，你课后如何和他进行有效沟通？","allPages":["assets/pages/人际关系/064-page-064.png","assets/pages/人际关系/064-page-065.png","assets/pages/人际关系/064-page-066.png","assets/pages/人际关系/064-page-067.png"],"analysis":"本题明确要求课后沟通，重点是理解学生从旁谈转为趴桌的原因， 并回应“没有影响别人”的看法。应区分身体疲惫、学习困难与抵触情 绪，不把睡觉一概解释为不尊重教师。"},{"category":"人际关系","color":"#E7B184","title":"老师批评小明并请家长","start":68,"pages":["assets/pages/人际关系/068-page-068.png","assets/pages/人际关系/068-page-069.png","assets/pages/人际关系/068-page-070.png"],"question":"李老师批评了小明，小明却不认错，李老师说让小明请家长，并告 诉班主任了，作为班主任你怎么办？","allPages":["assets/pages/人际关系/068-page-068.png","assets/pages/人际关系/068-page-069.png","assets/pages/人际关系/068-page-070.png","assets/pages/人际关系/068-page-071.png"],"analysis":"本题涉及教师批评与学生不认错的冲突。班主任应先核实原委，再 判断教育和家校沟通的需要，不能默认学生一定有错，也不能把请家长 作为迫使服从的惩罚。"},{"category":"人际关系","color":"#E7B184","title":"家长投诉你","start":72,"pages":["assets/pages/人际关系/072-page-072.png","assets/pages/人际关系/072-page-073.png","assets/pages/人际关系/072-page-074.png"],"question":"有家长到学校找到了校长投诉你，认为你教的不好，请问你该怎么 办？","allPages":["assets/pages/人际关系/072-page-072.png","assets/pages/人际关系/072-page-073.png","assets/pages/人际关系/072-page-074.png","assets/pages/人际关系/072-page-075.png"],"analysis":"本题的特定情境是家长已向校长投诉。应配合学校核查、主动回应 具体意见，以教学事实和改进效果处理问题，不能把投诉视作冒犯，也 不宜急于拿成绩证明自己完全没有问题。"},{"category":"人际关系","color":"#E7B184","title":"学生沉迷手机游戏","start":76,"pages":["assets/pages/人际关系/076-page-076.png","assets/pages/人际关系/076-page-077.png","assets/pages/人际关系/076-page-078.png"],"question":"发现学生沉迷于手机游戏，作为班主任，你会怎么处理？","allPages":["assets/pages/人际关系/076-page-076.png","assets/pages/人际关系/076-page-077.png","assets/pages/人际关系/076-page-078.png","assets/pages/人际关系/076-page-079.png"],"analysis":"本题要从游戏使用对日常生活的具体影响入手，而不是只看时长就 诊断成瘾。应把规则、学习支持、家庭环境和兴趣活动结合起来，避免 一收手机就认为问题已经解决。"},{"category":"人际关系","color":"#E7B184","title":"多次拒绝老同事","start":80,"pages":["assets/pages/人际关系/080-page-080.png","assets/pages/人际关系/080-page-081.png","assets/pages/人际关系/080-page-082.png"],"question":"作为新人，和老高共同一间办公室，他找你帮忙了几次后，你拒绝 了，他向领导抱怨你没有团队精神，你会怎么做？","allPages":["assets/pages/人际关系/080-page-080.png","assets/pages/人际关系/080-page-081.png","assets/pages/人际关系/080-page-082.png","assets/pages/人际关系/080-page-083.png"],"analysis":"本题是拒绝帮忙后引发的评价争议。要核对拒绝理由和表达方式， 主动修复沟通并向领导说明事实；不能把任何拒绝都等同于缺乏团队精 神，也不能无原则认错或报复性疏远。"},{"category":"人际关系","color":"#E7B184","title":"领导培养你","start":84,"pages":["assets/pages/人际关系/084-page-084.png","assets/pages/人际关系/084-page-085.png","assets/pages/人际关系/084-page-086.png"],"question":"你是单位新人，在工作中积极主动，勇于承担，因此，领导有意识 的培养你，因此，有一些同事疏远你，甚至排挤你，你怎么办？","allPages":["assets/pages/人际关系/084-page-084.png","assets/pages/人际关系/084-page-085.png","assets/pages/人际关系/084-page-086.png","assets/pages/人际关系/084-page-087.png"],"analysis":"本题考查获得培养机会后的团队关系处理。应珍惜成长机会、公平 合作，同时区分一般疏远与实际排挤。不能将不当对待合理化，也不必 通过放弃发展或无原则退让换取关系。"},{"category":"人际关系","color":"#E7B184","title":"加班加点做工作","start":88,"pages":["assets/pages/人际关系/088-page-088.png","assets/pages/人际关系/088-page-089.png","assets/pages/人际关系/088-page-090.png"],"question":"你刚进单位，有一些老员工抱着“帮助新员工成长”的心态，总是 把手头上的零碎工作交给你，你自己工作有时候加班加点才完成，你怎 么办？","allPages":["assets/pages/人际关系/088-page-088.png","assets/pages/人际关系/088-page-089.png","assets/pages/人际关系/088-page-090.png","assets/pages/人际关系/088-page-091.png"],"analysis":"本题突出新人被反复分配零碎任务导致本职工作受影响。要评估实 际工作量、明确任务优先级和协作边界，不能把所有超负荷都归因为能 力不足，也不必以无限加班换取认可。"},{"category":"人际关系","color":"#E7B184","title":"代课被学生捉弄","start":92,"pages":["assets/pages/人际关系/092-page-092.png","assets/pages/人际关系/092-page-093.png","assets/pages/人际关系/092-page-094.png"],"question":"王老师生病，请你去代他们班的课，但是他们班的学生不听话，总 是捉弄你，你怎么办？","allPages":["assets/pages/人际关系/092-page-092.png","assets/pages/人际关系/092-page-093.png","assets/pages/人际关系/092-page-094.png","assets/pages/人际关系/092-page-095.png"],"analysis":"本题涉及代课期间的秩序和师生关系。要及时制止捉弄并判断有无 安全风险，随后了解行为原因、衔接原有规则。不能靠讨好学生换取配 合，也不能把全班都认定为故意针对自己。"},{"category":"人际关系","color":"#E7B184","title":"家长管教严","start":96,"pages":["assets/pages/人际关系/096-page-096.png","assets/pages/人际关系/096-page-097.png","assets/pages/人际关系/096-page-098.png"],"question":"家长对孩子管教比较严格，要求孩子跟着家长的意愿发展，作为教 师，你会怎么做？","allPages":["assets/pages/人际关系/096-page-096.png","assets/pages/人际关系/096-page-097.png","assets/pages/人际关系/096-page-098.png","assets/pages/人际关系/096-page-099.png"],"analysis":"本题的重点是家庭期待与孩子自主发展的协调。应区分合理规则、 过度控制和侵害行为，帮助家长听见孩子的具体意愿，不能把严格管教 一概肯定，也不替家庭直接作发展决定。"},{"category":"人际关系","color":"#E7B184","title":"家长对老师产生质疑","start":100,"pages":["assets/pages/人际关系/100-page-100.png","assets/pages/人际关系/100-page-101.png","assets/pages/人际关系/100-page-102.png"],"question":"你是一名新班主任，家长会有家长对你产生质疑，你将如何和家长 进行沟通？","allPages":["assets/pages/人际关系/100-page-100.png","assets/pages/人际关系/100-page-101.png","assets/pages/人际关系/100-page-102.png","assets/pages/人际关系/100-page-103.png"],"analysis":"本题的特点是新班主任在家长会上受到质疑，具体内容尚未明确。 应稳住公开交流、澄清问题范围，涉及个体隐私转为单独沟通。没有核 实错误前，不必机械地先认错或展示一大套规划。"},{"category":"人际关系","color":"#E7B184","title":"学生早恋","start":104,"pages":["assets/pages/人际关系/104-page-104.png","assets/pages/人际关系/104-page-105.png","assets/pages/人际关系/104-page-106.png"],"question":"有学生告诉你，班级里张三和李四在谈恋爱，并且班上同学都知道 了，有同学也想学他们，作为班主任你怎么办？","allPages":["assets/pages/人际关系/104-page-104.png","assets/pages/人际关系/104-page-105.png","assets/pages/人际关系/104-page-106.png","assets/pages/人际关系/104-page-107.png"],"analysis":"本题不能以同学传言直接确认恋爱关系。应保护当事学生隐私，关 注交往边界、学习生活与安全，制止起哄和传播；教育重在尊重与责任 ，而不是公开审问或强行贴上“早恋”标签。"},{"category":"观点理解","color":"#DCA4B4","title":"教育家精神","start":5,"pages":["assets/pages/观点理解/005-page-005.png","assets/pages/观点理解/005-page-006.png","assets/pages/观点理解/005-page-007.png"],"question":"请你谈一谈你对“教育家精神”的理解？新时代教师，应如何践行 “教育家精神”？","allPages":["assets/pages/观点理解/005-page-005.png","assets/pages/观点理解/005-page-006.png","assets/pages/观点理解/005-page-007.png","assets/pages/观点理解/005-page-008.png"],"analysis":"本题考查对教育家精神的准确理解和职业认同。应抓住六个方面的 内涵，说明它既有家国情怀，也有日常育人智慧，并联系一线教学谈践 行，避免只罗列名人事迹或把它视为少数名师的专属要求。"},{"category":"观点理解","color":"#DCA4B4","title":"《哪吒》中的教育启示","start":9,"pages":["assets/pages/观点理解/009-page-009.png","assets/pages/观点理解/009-page-010.png","assets/pages/观点理解/009-page-011.png"],"question":"作为教师，对于电影《哪吒之魔童闹海》中的家庭教育、个性培养 ，请谈谈你的教育启示。","allPages":["assets/pages/观点理解/009-page-009.png","assets/pages/观点理解/009-page-010.png","assets/pages/观点理解/009-page-011.png","assets/pages/观点理解/009-page-012.png"],"analysis":"本题借电影话题考查家庭教育、个性培养和教师教育观。回答应围 绕接纳、规则、信任和引导展开，既肯定个体差异，也强调责任意识， 避免把“尊重个性”理解为放任学生随意发展。"},{"category":"观点理解","color":"#DCA4B4","title":"守得住清贫，耐得住寂寞","start":13,"pages":["assets/pages/观点理解/013-page-013.png","assets/pages/观点理解/013-page-014.png","assets/pages/观点理解/013-page-015.png"],"question":"作为一名一线教师，请详细谈一谈你对“教师要守得住清贫，耐得 住寂寞”这句话的理解与思考。","allPages":["assets/pages/观点理解/013-page-013.png","assets/pages/观点理解/013-page-014.png","assets/pages/观点理解/013-page-015.png","assets/pages/观点理解/013-page-016.png"],"analysis":"本题考查教师职业理想和价值选择。应说明这句话强调不被功利诱 惑左右、愿意长期投入育人工作，同时也要尊重教师正当权益，避免把 清贫和寂寞理解为否定专业成长或合理生活需求。"},{"category":"观点理解","color":"#DCA4B4","title":"教育的力度与温度","start":17,"pages":["assets/pages/观点理解/017-page-017.png","assets/pages/观点理解/017-page-018.png","assets/pages/观点理解/017-page-019.png"],"question":"作为一名教师，请你谈谈对“教育既要‘惊涛拍岸之势’，也要‘ 润物细无声’”这句话的理解。","allPages":["assets/pages/观点理解/017-page-017.png","assets/pages/观点理解/017-page-018.png","assets/pages/观点理解/017-page-019.png","assets/pages/观点理解/017-page-020.png"],"analysis":"本题讨论教育的严格要求和潜移默化。应说明“力度”体现原则、 边界和必要干预，“温度”体现尊重、耐心和长期影响；两者共同服务 学生成长，不能把力度理解为粗暴，也不能把温度理解为放任。"},{"category":"观点理解","color":"#DCA4B4","title":"皮格马利翁效应","start":21,"pages":["assets/pages/观点理解/021-page-021.png","assets/pages/观点理解/021-page-022.png","assets/pages/观点理解/021-page-023.png"],"question":"什么是皮格马利翁效应（罗森塔尔效应）？请谈谈罗森塔尔效应对 学生成长的影响。作为教师，你会如何运用这一效应，激发学生的潜能 ？","allPages":["assets/pages/观点理解/021-page-021.png","assets/pages/观点理解/021-page-022.png","assets/pages/观点理解/021-page-023.png","assets/pages/观点理解/021-page-024.png"],"analysis":"本题考查积极期待对学生成长的影响。应说明教师期待会通过关注 机会、反馈方式和学生自我认同影响表现，但期待不是万能魔法。运用 时要做到面向全体、具体真实、目标合理、反馈持续。"},{"category":"观点理解","color":"#DCA4B4","title":"教育公平","start":25,"pages":["assets/pages/观点理解/025-page-025.png","assets/pages/观点理解/025-page-026.png","assets/pages/观点理解/025-page-027.png"],"question":"作为一名教师，请你谈谈对“教育公平”的理解。在教育过程中， 教师应如何关注和促进班级内的教育公平，而不是仅仅停留在“分数公 平”上？","allPages":["assets/pages/观点理解/025-page-025.png","assets/pages/观点理解/025-page-026.png","assets/pages/观点理解/025-page-027.png","assets/pages/观点理解/025-page-028.png"],"analysis":"本题考查对公平的全面理解。应说明教育公平不仅是分数或同一标 准，还包括机会公平、过程公平、资源支持和评价公平。教师在班级中 要关注隐性差异，提供适切支持，保护每个学生的发展机会。"},{"category":"观点理解","color":"#DCA4B4","title":"太阳底下最光辉的职业","start":29,"pages":["assets/pages/观点理解/029-page-029.png","assets/pages/观点理解/029-page-030.png","assets/pages/观点理解/029-page-031.png"],"question":"你是如何理解“教师是太阳底下最光辉的职业”这句话的？","allPages":["assets/pages/观点理解/029-page-029.png","assets/pages/观点理解/029-page-030.png","assets/pages/观点理解/029-page-031.png","assets/pages/观点理解/029-page-032.png"],"analysis":"本题重在解释对教师职业价值的赞誉。应围绕传承知识、启发心智 和支持成长展开，同时将职业荣誉与专业责任联系起来，避免把“光辉 ”理解为职业高低排序或无限度的个人牺牲。"},{"category":"观点理解","color":"#DCA4B4","title":"因材施教","start":33,"pages":["assets/pages/观点理解/033-page-033.png","assets/pages/观点理解/033-page-034.png","assets/pages/观点理解/033-page-035.png"],"question":"孔子的教育实践体现了“因材施教”的思想。作为新时代青年教师 ，你是怎么理解的？","allPages":["assets/pages/观点理解/033-page-033.png","assets/pages/观点理解/033-page-034.png","assets/pages/观点理解/033-page-035.png","assets/pages/观点理解/033-page-036.png"],"analysis":"本题考查对学生差异与教学适应性的认识。应说明在共同育人目标 下，根据学生基础、困难和兴趣调整支持，帮助人人发展；避免将学生 固定分层、贴上能力标签，或把因材施教理解为降低基本要求。"},{"category":"观点理解","color":"#DCA4B4","title":"四个引路人","start":37,"pages":["assets/pages/观点理解/037-page-037.png","assets/pages/观点理解/037-page-038.png","assets/pages/观点理解/037-page-039.png"],"question":"请你谈一谈什么是四个引路人？你又是怎么理解的？","allPages":["assets/pages/观点理解/037-page-037.png","assets/pages/观点理解/037-page-038.png","assets/pages/观点理解/037-page-039.png","assets/pages/观点理解/037-page-040.png"],"analysis":"本题应准确说明“四个引路人”的具体内容，再解释四者共同指向 学生成长。回答要突出“引路”的含义：既明确方向、提供支持，也尊 重学生的主动探索，避免将其简单等同于替学生安排一切。"},{"category":"观点理解","color":"#DCA4B4","title":"学高为师，身正为范","start":41,"pages":["assets/pages/观点理解/041-page-041.png","assets/pages/观点理解/041-page-042.png","assets/pages/观点理解/041-page-043.png"],"question":"“学高为师，身正为范”，要加强师德师风建设，作为新时代青年 教师，谈谈你对这句话的理解，在今后的工作中应该如何去践行？","allPages":["assets/pages/观点理解/041-page-041.png","assets/pages/观点理解/041-page-042.png","assets/pages/观点理解/041-page-043.png","assets/pages/观点理解/041-page-044.png"],"analysis":"本题考查师德师风和青年教师成长。应说明学高体现专业学识与持 续学习，身正体现品行端正与行为示范。践行时要从备课教学、师生交 往、廉洁从教和自我反思等方面展开。"},{"category":"观点理解","color":"#DCA4B4","title":"教学中的教与学","start":45,"pages":["assets/pages/观点理解/045-page-045.png","assets/pages/观点理解/045-page-046.png","assets/pages/观点理解/045-page-047.png"],"question":"有人说“教学之为教学，一半是教，一半是学”。你觉得哪个更重 要？对于这句话，谈谈你的理解？","allPages":["assets/pages/观点理解/045-page-045.png","assets/pages/观点理解/045-page-046.png","assets/pages/观点理解/045-page-047.png","assets/pages/观点理解/045-page-048.png"],"analysis":"本题是关系辨析题，不宜简单选择一方。应说明教起引导作用、学 是学生主动建构的过程，二者相互促进；“一半”强调双方不可缺少， 并不意味着课堂时间或作用必须平均分配。"},{"category":"观点理解","color":"#DCA4B4","title":"有教无类","start":49,"pages":["assets/pages/观点理解/049-page-049.png","assets/pages/观点理解/049-page-050.png","assets/pages/观点理解/049-page-051.png"],"question":"孔子说：“有教无类”，作为新时代青年教师，你是怎么理解的？","allPages":["assets/pages/观点理解/049-page-049.png","assets/pages/观点理解/049-page-050.png","assets/pages/观点理解/049-page-051.png","assets/pages/观点理解/049-page-052.png"],"analysis":"本题考查对平等教育观的理解。应突出不因出身、家庭条件和暂时 表现而排斥学生，说明人人值得被尊重并获得成长机会；同时区分平等 对待与完全相同的支持，联系班级中的机会分配和困难帮扶。"},{"category":"观点理解","color":"#DCA4B4","title":"让学生学会自己思考","start":53,"pages":["assets/pages/观点理解/053-page-053.png","assets/pages/观点理解/053-page-054.png","assets/pages/观点理解/053-page-055.png"],"question":"在教育中，摆在学生面前的困难不是背书、也不是记住别人的思想 ，而是学生自己的思考。请谈谈你对这句话的理解。","allPages":["assets/pages/观点理解/053-page-053.png","assets/pages/观点理解/053-page-054.png","assets/pages/观点理解/053-page-055.png","assets/pages/观点理解/053-page-056.png"],"analysis":"本题强调独立思考在学习中的价值。应说明记忆是基础，思考使知 识得到理解、判断和运用；回答要突出学生形成自己有依据的认识，避 免将思考与知识积累对立，或把没有依据的反对等同于独立思考。"},{"category":"观点理解","color":"#DCA4B4","title":"教育的艺术在于激励和鼓舞","start":57,"pages":["assets/pages/观点理解/057-page-057.png","assets/pages/观点理解/057-page-058.png","assets/pages/观点理解/057-page-059.png"],"question":"教育的艺术，不在于传授，而在于激励和鼓舞，你是怎么理解的？","allPages":["assets/pages/观点理解/057-page-057.png","assets/pages/观点理解/057-page-058.png","assets/pages/观点理解/057-page-059.png","assets/pages/观点理解/057-page-060.png"],"analysis":"本题强调情感支持和学习动力对教育的意义。应解释激励如何帮助 学生愿学、敢学，同时说明它与知识传授相互支撑；有效鼓励要具体、 真实并伴随方法支持，不能理解为一味表扬。"},{"category":"观点理解","color":"#DCA4B4","title":"老师是学生的镜子","start":61,"pages":["assets/pages/观点理解/061-page-061.png","assets/pages/观点理解/061-page-062.png","assets/pages/观点理解/061-page-063.png"],"question":"“老师是学生的镜子，学生是老师的影子”，你如何理解这句话？","allPages":["assets/pages/观点理解/061-page-061.png","assets/pages/观点理解/061-page-062.png","assets/pages/观点理解/061-page-063.png","assets/pages/观点理解/061-page-064.png"],"analysis":"本题考查教师示范作用。应说明教师言行会影响学生，学生表现也 能反映教育效果，但不能机械认为学生所有问题都由教师造成。回答要 体现以身作则、反思改进和尊重学生主体性的统一。"},{"category":"观点理解","color":"#DCA4B4","title":"手中有戒尺，心中有温度","start":65,"pages":["assets/pages/观点理解/065-page-065.png","assets/pages/观点理解/065-page-066.png","assets/pages/观点理解/065-page-067.png"],"question":"有人说“教师要手中有戒尺，心中有温度”。请谈谈你对这句话的 理解？","allPages":["assets/pages/观点理解/065-page-065.png","assets/pages/观点理解/065-page-066.png","assets/pages/观点理解/065-page-067.png","assets/pages/观点理解/065-page-068.png"],"analysis":"本题讨论规则教育与关爱学生的统一。“戒尺”宜理解为教育原则 和行为边界，不能借此合理化体罚。应说明严格要求为何必要，以及尊 重、适度、具有教育目的的处理才能促进学生改正。"},{"category":"观点理解","color":"#DCA4B4","title":"干一行爱一行与岗位探索","start":69,"pages":["assets/pages/观点理解/069-page-069.png","assets/pages/观点理解/069-page-070.png","assets/pages/观点理解/069-page-071.png"],"question":"有人说做工作要干一行爱一行，也有人说青年要多接触不同的岗位 ，你怎么理解？","allPages":["assets/pages/观点理解/069-page-069.png","assets/pages/观点理解/069-page-070.png","assets/pages/观点理解/069-page-071.png","assets/pages/观点理解/069-page-072.png"],"analysis":"本题是职业观念的关系辨析。岗位探索有助于认识兴趣和能力，干 一行爱一行强调对所承担工作的责任，两者可以相容。应区分有计划的 探索与逃避困难，体现教师岗位上的投入、学习和理性选择。"},{"category":"观点理解","color":"#DCA4B4","title":"教是为了不教","start":73,"pages":["assets/pages/观点理解/073-page-073.png","assets/pages/观点理解/073-page-074.png","assets/pages/观点理解/073-page-075.png"],"question":"叶圣陶先生有句广为流传的话：“教是为了不教。”作为教师，你 如何理解这句话？","allPages":["assets/pages/观点理解/073-page-073.png","assets/pages/观点理解/073-page-074.png","assets/pages/观点理解/073-page-075.png","assets/pages/观点理解/073-page-076.png"],"analysis":"本题考查对自主学习与教师指导关系的认识。“不教”指学生逐步 具备独立学习能力，并非教师退出课堂。应解释从指导到自主的变化， 说明方法习得、实践迁移和必要支持之间的关系。"},{"category":"观点理解","color":"#DCA4B4","title":"奋斗是青春最亮丽的底色","start":77,"pages":["assets/pages/观点理解/077-page-077.png","assets/pages/观点理解/077-page-078.png","assets/pages/观点理解/077-page-079.png"],"question":"领导说“奋斗是青春最亮丽的底色，行动是青年最好的磨砺”，请 谈谈你的理解？","allPages":["assets/pages/观点理解/077-page-077.png","assets/pages/观点理解/077-page-078.png","assets/pages/观点理解/077-page-079.png","assets/pages/观点理解/077-page-080.png"],"analysis":"本题围绕青年成长与行动展开。应说明理想需要实践支撑，奋斗包 含持续学习、克服困难和服务他人；同时强调方向、方法与复盘，避免 把奋斗简单等同于忙碌、熬夜或不顾实际的坚持。"},{"category":"观点理解","color":"#DCA4B4","title":"立德树人","start":81,"pages":["assets/pages/观点理解/081-page-081.png","assets/pages/观点理解/081-page-082.png","assets/pages/观点理解/081-page-083.png"],"question":"作为一名教师，请你谈谈对“立德树人”的理解？应如何落实“立 德树人”的根本任务？","allPages":["assets/pages/观点理解/081-page-081.png","assets/pages/观点理解/081-page-082.png","assets/pages/观点理解/081-page-083.png","assets/pages/观点理解/081-page-084.png"],"analysis":"本题既问内涵，也问落实。核心是说明立德与树人的统一：把价值 引导融入知识学习和日常生活，促进学生全面发展。回答应避免将德育 理解为单独说教，或把育人成效等同于考试分数。"},{"category":"观点理解","color":"#DCA4B4","title":"严师出高徒与教育边界","start":85,"pages":["assets/pages/观点理解/085-page-085.png","assets/pages/观点理解/085-page-086.png","assets/pages/观点理解/085-page-087.png"],"question":"如今，不少老师自嘲“以前严师出高徒，现在严师被开除”，作为 教师，你如何理解这句话？","allPages":["assets/pages/观点理解/085-page-085.png","assets/pages/观点理解/085-page-086.png","assets/pages/观点理解/085-page-087.png","assets/pages/观点理解/085-page-088.png"],"analysis":"本题回应社会语境中的严与边界。应说明严格要求仍有价值，但必 须建立在尊重人格、依法依规和教育目的之上。回答要区分负责任的严 格与伤害性做法，并提出沟通和制度支持。"},{"category":"观点理解","color":"#DCA4B4","title":"以美育人，以文化人","start":89,"pages":["assets/pages/观点理解/089-page-089.png","assets/pages/观点理解/089-page-090.png","assets/pages/观点理解/089-page-091.png"],"question":"作为一名新时代一线教师，谈一谈你对以美育人、以文化人的理解 ，以及学校如何培养学生的艺术素养、开展好美育教育？","allPages":["assets/pages/观点理解/089-page-089.png","assets/pages/观点理解/089-page-090.png","assets/pages/观点理解/089-page-091.png","assets/pages/观点理解/089-page-092.png"],"analysis":"本题考查美育的育人价值和实施路径。应说明美育不只是培养少数 特长生，而是面向全体学生提升审美感受、文化理解和创造表达。回答 可从课程、活动、环境和评价四方面展开。"},{"category":"观点理解","color":"#DCA4B4","title":"天下难事，必作于易","start":93,"pages":["assets/pages/观点理解/093-page-093.png","assets/pages/观点理解/093-page-094.png","assets/pages/观点理解/093-page-095.png"],"question":"老子说：“天下难事，必作于易；天下大事，必作于细。”谈谈你 对这句话的理解？","allPages":["assets/pages/观点理解/093-page-093.png","assets/pages/观点理解/093-page-094.png","assets/pages/观点理解/093-page-095.png","assets/pages/观点理解/093-page-096.png"],"analysis":"本题强调从基础、细节和可行的小事入手成就大事。应说明小事如 何积累为整体成效，同时把细致与全局意识结合起来，避免把抓细节理 解为面面俱到、过度控制或忽视工作重点。"},{"category":"观点理解","color":"#DCA4B4","title":"脑中有方，眼中有人","start":97,"pages":["assets/pages/观点理解/097-page-097.png","assets/pages/观点理解/097-page-098.png","assets/pages/观点理解/097-page-099.png"],"question":"真正的好老师要做到“脑中有方，眼中有人，心中有事，手中有尺 ”。作为教师，你如何理解这句话？","allPages":["assets/pages/观点理解/097-page-097.png","assets/pages/观点理解/097-page-098.png","assets/pages/观点理解/097-page-099.png","assets/pages/观点理解/097-page-100.png"],"analysis":"本题用四个比喻概括教师素养。应分别说明方法、学生意识、责任 担当和原则尺度，并解释它们如何相互配合。重点是把以学生为本与专 业判断结合起来，不能机械套用方法或只凭热情开展教育。"},{"category":"观点理解","color":"#DCA4B4","title":"其身正，不令而行","start":101,"pages":["assets/pages/观点理解/101-page-101.png","assets/pages/观点理解/101-page-102.png","assets/pages/观点理解/101-page-103.png"],"question":"《论语》中记载：“其身正，不令而行；其身不正，虽令不从。” 请结合教师职业谈谈看法。","allPages":["assets/pages/观点理解/101-page-101.png","assets/pages/观点理解/101-page-102.png","assets/pages/观点理解/101-page-103.png","assets/pages/观点理解/101-page-104.png"],"analysis":"本题考查师德示范与教育权威。应说明教师自身端正是教育学生的 重要前提，言行一致能增强教育说服力；同时要将榜样作用与制度规则、 专业管理结合起来，避免把教师个人修养神化。"},{"category":"观点理解","color":"#DCA4B4","title":"梦虽遥，追则能达","start":105,"pages":["assets/pages/观点理解/105-page-105.png","assets/pages/观点理解/105-page-106.png","assets/pages/观点理解/105-page-107.png"],"question":"“梦虽遥，追则能达；愿虽艰，持则可圆”对此，谈一谈你怎么理 解?","allPages":["assets/pages/观点理解/105-page-105.png","assets/pages/观点理解/105-page-106.png","assets/pages/观点理解/105-page-107.png","assets/pages/观点理解/105-page-108.png"],"analysis":"本题围绕理想、行动和坚持展开。应解释追求使梦想拥有实现的可 能，坚持帮助跨越困难，同时强调目标要符合实际、路径需要调整。联 系教师成长，体现长期追求与具体行动的结合。"},{"category":"观点理解","color":"#DCA4B4","title":"教育的三个根本问题","start":109,"pages":["assets/pages/观点理解/109-page-109.png","assets/pages/观点理解/109-page-110.png","assets/pages/观点理解/109-page-111.png"],"question":"培养什么人、怎样培养人、为谁培养人是教育的根本问题，也是建 设教育强国的核心课题。习近平总书记强调：“要坚持思政课建设和党 的创新理论武装同步推进、思政课程和课程思政同向同行，把思政教育 ‘小课堂’和社会‘大课堂’有效融合起来，要善用‘大思政课’为党 育人、为国育才。”请结合学校工作实际，谈谈你的理解。","allPages":["assets/pages/观点理解/109-page-109.png","assets/pages/观点理解/109-page-110.png","assets/pages/观点理解/109-page-111.png","assets/pages/观点理解/109-page-112.png"],"analysis":"本题围绕培养什么人、怎样培养人、为谁培养人展开。应从立德树 人、课程思政、大思政课和学校实践说明理解，突出各学科同向同行、 校内外资源协同育人，避免把思政教育形式化、口号化。"},{"category":"观点理解","color":"#DCA4B4","title":"做学生为学、为事、为人的大先生","start":113,"pages":["assets/pages/观点理解/113-page-113.png","assets/pages/观点理解/113-page-114.png","assets/pages/观点理解/113-page-115.png"],"question":"什么是大先生，在新时代背景下，你该怎么去做一位大先生？","allPages":["assets/pages/观点理解/113-page-113.png","assets/pages/观点理解/113-page-114.png","assets/pages/观点理解/113-page-115.png","assets/pages/观点理解/113-page-116.png"],"analysis":"本题考查教师对育人使命的认识。“大先生”强调既教知识，也以 品格和学识引导学生成长。应把为学、为事、为人的统一讲清楚，联系 日常教学，避免把“大”理解为头衔、资历或单纯的学术成就。"},{"category":"观点理解","color":"#DCA4B4","title":"于漪：教到学生心中","start":117,"pages":["assets/pages/观点理解/117-page-117.png","assets/pages/观点理解/117-page-118.png","assets/pages/观点理解/117-page-119.png"],"question":"于漪老师曾说：“我不断地反思，我一辈子上的课，有多少是上在 黑板上的，有多少是教到学生心中的。”作为教师，你如何理解这句话 ？","allPages":["assets/pages/观点理解/117-page-117.png","assets/pages/观点理解/117-page-118.png","assets/pages/观点理解/117-page-119.png","assets/pages/观点理解/117-page-120.png"],"analysis":"本题考查对课堂育人深度的理解。应说明教学不能停留在板书和讲 授表面，而要进入学生理解、情感和行动中。回答可从目标设计、课堂 互动和课后反思展开，避免把“教到心中”理解成单纯煽情。"},{"category":"观点理解","color":"#DCA4B4","title":"南风效应","start":121,"pages":["assets/pages/观点理解/121-page-121.png","assets/pages/观点理解/121-page-122.png","assets/pages/观点理解/121-page-123.png"],"question":"温暖胜于严寒，温情教育有时候或许更有效。作为一名教师，请你 谈一谈对南风效应的理解与思考？","allPages":["assets/pages/观点理解/121-page-121.png","assets/pages/观点理解/121-page-122.png","assets/pages/观点理解/121-page-123.png","assets/pages/观点理解/121-page-124.png"],"analysis":"本题借“南风效应”讨论温暖教育。应说明尊重、理解和鼓励往往 比简单压制更能激发学生主动改变，但温情教育仍需规则和边界。回答 要体现关爱、激励、方法支持和必要约束。"},{"category":"观点理解","color":"#DCA4B4","title":"五育并举到五育融合","start":125,"pages":["assets/pages/观点理解/125-page-125.png","assets/pages/观点理解/125-page-126.png","assets/pages/观点理解/125-page-127.png"],"question":"新课标背景下，育人由原来的五育并举过渡到五育融合，你如何看 待从五育并举到五育融合的育人实践？","allPages":["assets/pages/观点理解/125-page-125.png","assets/pages/观点理解/125-page-126.png","assets/pages/观点理解/125-page-127.png","assets/pages/观点理解/125-page-128.png"],"analysis":"本题考查对全面育人的理解。应说明五育融合不是取消各育独立价 值，也不是每节课生硬塞入五育，而是在真实学习任务中促进德智体美 劳相互支撑，形成更完整的育人过程。"},{"category":"观点理解","color":"#DCA4B4","title":"生活教育","start":129,"pages":["assets/pages/观点理解/129-page-129.png","assets/pages/观点理解/129-page-130.png","assets/pages/观点理解/129-page-131.png"],"question":"作为一名新时代教师，请你谈一谈什么是“生活教育”，如何理解 ？如何科学详细的开展生活教育？","allPages":["assets/pages/观点理解/129-page-129.png","assets/pages/观点理解/129-page-130.png","assets/pages/观点理解/129-page-131.png","assets/pages/观点理解/129-page-132.png"],"analysis":"本题考查对生活教育思想的理解和实施。应说明生活教育强调从真 实生活出发，在做中学、用中学，并把课堂知识与社会实践连接。回答 要避免把生活教育简单等同于外出活动或零散体验。"},{"category":"观点理解","color":"#DCA4B4","title":"四有好老师","start":133,"pages":["assets/pages/观点理解/133-page-133.png","assets/pages/观点理解/133-page-134.png","assets/pages/观点理解/133-page-135.png"],"question":"什么是“四有教师”？请谈谈，你对“四有教师”的理解？","allPages":["assets/pages/观点理解/133-page-133.png","assets/pages/观点理解/133-page-134.png","assets/pages/观点理解/133-page-135.png","assets/pages/观点理解/133-page-136.png"],"analysis":"本题考查对教师职业标准的理解。应准确解释“四有”的内涵，说 明信念、师德、学识和爱心相互支撑，并联系教师日常工作，体现育人 责任与专业能力的统一。"},{"category":"观点理解","color":"#DCA4B4","title":"于永正：知道学生需要什么","start":137,"pages":["assets/pages/观点理解/137-page-137.png","assets/pages/观点理解/137-page-138.png","assets/pages/观点理解/137-page-139.png"],"question":"教育名家于永正老师认为：“教师只有一颗童心才能真正走进学生 的心，知道学生真正需要什么。”对此，请谈谈你的理解？","allPages":["assets/pages/观点理解/137-page-137.png","assets/pages/观点理解/137-page-138.png","assets/pages/观点理解/137-page-139.png","assets/pages/观点理解/137-page-140.png"],"analysis":"本题强调童心、理解学生和教学适切性。应说明教师要走近学生的 经验世界，了解真实困难与发展需要，并把理解转化为教学和管理策略 ，避免把童心等同于讨好学生或降低要求。"},{"category":"观点理解","color":"#DCA4B4","title":"教师是良心活还是专业活","start":141,"pages":["assets/pages/观点理解/141-page-141.png","assets/pages/观点理解/141-page-142.png","assets/pages/观点理解/141-page-143.png"],"question":"教师是“良心活”还是“专业活”？二者关系又是怎样的？作为一 名新时代教师，请详细谈谈你的看法与教育思考？","allPages":["assets/pages/观点理解/141-page-141.png","assets/pages/观点理解/141-page-142.png","assets/pages/观点理解/141-page-143.png","assets/pages/观点理解/141-page-144.png"],"analysis":"本题要求辨析教师职业伦理与专业能力的关系。应说明良心提供价 值底线和责任感，专业保障教育效果和方法质量，两者缺一不可。回答 要避免只讲奉献，也避免把教育完全技术化。"},{"category":"观点理解","color":"#DCA4B4","title":"经师与人师相统一","start":145,"pages":["assets/pages/观点理解/145-page-145.png","assets/pages/观点理解/145-page-146.png","assets/pages/观点理解/145-page-147.png"],"question":"作为一名教师，如何理解“新时代教师要做经师和人师的统一者” ？以后的工作中如何做到经师和人师相统一？","allPages":["assets/pages/观点理解/145-page-145.png","assets/pages/观点理解/145-page-146.png","assets/pages/观点理解/145-page-147.png","assets/pages/观点理解/145-page-148.png"],"analysis":"本题考查教师专业能力和育人责任。应说明“经师”重在传授知识、 培养能力，“人师”重在品格引领和价值塑造，二者共同构成新时代教 师要求。回答要联系备课、课堂、评价和师德实践。"},{"category":"社会现象","color":"#79B86B","title":"九三阅兵","start":11,"pages":["assets/pages/社会现象/011-page-011.png","assets/pages/社会现象/011-page-012.png","assets/pages/社会现象/011-page-013.png"],"question":"今年是中国人民反法西斯战争胜利周年，“九三阅兵”不仅展示了 国防实力，也彰显了民族精神。作为一名教师，谈谈你的看法？你认为 该如何在教育教学中培育学生的家国情怀？","allPages":["assets/pages/社会现象/011-page-011.png","assets/pages/社会现象/011-page-012.png","assets/pages/社会现象/011-page-013.png","assets/pages/社会现象/011-page-014.png"],"analysis":"本题围绕“九三阅兵”展开，整体偏积极类社会现象题。作答时可 先肯定其现实价值，再分析推进中的难点，最后从制度保障、学校落实、 社会协同和教师行动等角度提出建议。"},{"category":"社会现象","color":"#79B86B","title":"加强中小学日常考试管理","start":15,"pages":["assets/pages/社会现象/015-page-015.png","assets/pages/社会现象/015-page-016.png","assets/pages/社会现象/015-page-017.png"],"question":"近日，教育部正式出 function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);

}
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const chars = Array.from(text);

  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line); line = ch;
      if (lines.length === maxLines - 1) break;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  ctx.fillStyle = '#777'; ctx.font = '20px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('2026 年最新版 · 持续更新', 92, 1592);
  ctx.fillStyle = ink; ctx.font = '700 20px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('教师岗', 1080, 1592);

  return canvas.toDataURL('image/png');
}
async function downloadCurrent() {
  if (!current) return;
  const btn = document.getElementById('downloadBtn');
  const oldText = btn.textContent;
  const pagesToDownload = current.allPages || current.pages;
  btn.textContent = `正在生成 1/${pagesToDownload.length}...`; btn.disabled = true;
  const safe = `${current.category}-${current.title}`.replace(/[\/:*?"<>|\s]+/g, '-').slice(0, 48);
  for (let i = 0; i < pagesToDownload.length; i++) {
    btn.textContent = `正在生成 ${i + 1}/${pagesToDownload.length}...`;
    const url = await makePosterPng(i, pagesToDownload[i]);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safe}-第${i + 1}页.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise(resolve => setTimeout(resolve, 180));
  }
  btn.disabled = false; btn.textContent = oldText;
}
document.getElementById('randomBtn').addEventListener('click', pick);
document.getElementById('downloadBtn').addEventListener('click', downloadCurrent);
document.getElementById('copyTitleBtn').addEventListener('click', () => copyTextFrom('titleText'));
document.getElementById('copyBodyBtn').addEventListener('click', () => copyTextFrom('bodyText'));
document.getElementById('copyTagsBtn').addEventListener('click', () => copyTextFrom('tagsText'));
document.getElementById('copyAllBtn').addEventListener('click', copyAllText);
pick();
</script>
