let current = null;
function pick() {

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  const chars = Array.from(text);
  let line = '', lines = [];
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line); line = ch;
      if (lines.length === maxLines - 1) break;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) lines = lines.slice(0, maxLines);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
}
async function makePosterPng(idx) {
  const canvas = document.createElement('canvas');
  canvas.width = 1242; canvas.height = 1656;
  const ctx = canvas.getContext('2d');
  const accent = current.color || '#79B86B';
  const ink = '#7f1d2d';

  ctx.fillStyle = '#fffaf7';
  ctx.fillRect(0, 0, 1242, 1656);
  ctx.fillStyle = 'rgba(0,0,0,.035)';
  for (let y = 16; y < 1656; y += 28) for (let x = 16; x < 1242; x += 28) {
    ctx.beginPath(); ctx.arc(x, y, 1.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = accent;
  ctx.lineWidth = 56;
  ctx.strokeRect(28, 28, 1186, 1600);

  ctx.fillStyle = accent;
  ctx.globalAlpha = .82;
  ctx.font = '23px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('★★★★★★★★★★★★★★★★★★★★★★★★', 58, 60);
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#2b7773';
  ctx.font = '600 24px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(`结构化面试 ${current.category}类`, 92, 102);
  ctx.strokeStyle = accent; ctx.lineWidth = 2;
  roundRect(ctx, 980, 74, 160, 46, 23); ctx.stroke();
  ctx.fillStyle = accent; ctx.font = '22px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(`第 ${idx + 1} 页`, 1012, 105);

  ctx.fillStyle = ink;
  ctx.font = '800 46px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  drawWrappedText(ctx, current.title, 621, 185, 900, 56, 2);
  ctx.fillStyle = '#8b6670';
  ctx.font = '22px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText(idx === 0 ? '预测题 / 解析' : (idx === 1 ? '思维导图' : '参考逐字稿'), 621, 252);
  ctx.textAlign = 'left';

  const img = await loadImage(current.pages[idx]);
  ctx.shadowColor = 'rgba(30,35,40,.22)'; ctx.shadowBlur = 42; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#fff'; ctx.fillRect(171, 275, 900, 1274);
  ctx.drawImage(img, 171, 275, 900, 1274);
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  ctx.fillStyle = '#777'; ctx.font = '20px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('2026 年最新版 · 持续更新', 92, 1592);
  ctx.fillStyle = ink; ctx.font = '700 20px "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('教师岗', 1080, 1592);

  return canvas.toDataURL('image/png');
}
async function downloadCurrent() {
  if (!current) return;
  const btn = document.getElementById('downloadBtn');
  const oldText = btn.textContent;
  btn.textContent = '正在生成...'; btn.disabled = true;
  const safe = `${current.category}-${current.title}`.replace(/[\\/:*?"<>|\s]+/g, '-').slice(0, 48);
  for (let i = 0; i < 3; i++) {
    const url = await makePosterPng(i);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${safe}-第${i + 1}页.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
  btn.disabled = false; btn.textContent = oldText;
}
document.getElementById('randomBtn').addEventListener('click', pick);
document.getElementById('downloadBtn').addEventListener('click', downloadCurrent);
